%YAML 1.2
---
# Randomised trials that underpin the cardiogenic shock guidelines, and the
# populations they enrolled.
#
# This file holds *literature values only* -- what each paper reported. The
# eligibility logic lives in code/clifcs/trials.py, where each criterion can be
# commented and reviewed next to the CLIF column it reads. Numbers here are
# meant to be checkable against the cited paper, so each carries its source.
#
# `published` is used two ways by 11_trial_alignment.py:
#
#   1. as a REPRESENTATIVENESS CHECK -- our trial-eligible subset is compared
#      against the enrolled population. If our eligible patients are a decade
#      older or half as hyperlactataemic, "eligible" does not mean "resembles
#      the people the recommendation was tested on", and the comparison says so.
#   2. nowhere else. The trial *regions* in embedding space are fitted from our
#      own eligible patients, not from these marginal summaries -- see the
#      note on circularity in clifcs.trials.fit_regions.
#
# A published value of `null` means the paper did not report it (or it was not
# retrievable), not that it is zero.
#
# ---------------------------------------------------------------------------
# WHAT CANNOT BE APPLIED AT THESE SITES
#
# Left ventricular ejection fraction is unavailable. Neither extract has an
# echo table, and ejection fraction appears in no vitals, labs or assessment
# category at either site. DanGer Shock enrolled on LVEF < 45% and SHOCK on
# shock due to LV failure, so for those two the eligible set here is a strict
# SUPERSET of the trial's: every other criterion is applied, the ventricular
# one is not. Each trial's `not_implementable` list in trials.py records this,
# and 11 prints it beside every count so no eligibility number is read as
# exact.
#
# Coronary anatomy is unavailable for the same reason -- no angiography detail
# in CLIF 2.1 -- which is why CULPRIT-SHOCK's multivessel requirement and
# OptimaCC's "after successful PCI" cannot be applied.

# ---------------------------------------------------------------------------
# PUBLISHED BASELINE TABLES (`table1`)
#
# The baseline characteristics table of each paper, which is what makes it
# possible to ask whether a patient who *would have qualified* actually looks
# like the people who were enrolled. Enrolment criteria are thresholds and
# admit a wide range; a DanGer Shock-eligible patient with a systolic pressure
# of 60 and a heart rate of 70 clears every criterion and still sits outside
# both interquartile ranges the trial reported, so the result was never tested
# on anyone much like them.
#
# Schema, per variable:
#   {median: m, iqr: [q1, q3]}   a continuous variable
#   {pct: p}                     a proportion, 0-1
# A variable absent from a trial's block was not reported by that paper (or not
# retrievable), and is skipped for that trial rather than guessed at.
#
# Variable names are the cohort's own column names where one exists, so
# clifcs.trials.table1_position can look them up directly.
#
# POOLING ACROSS ARMS. These trials randomised, so their arms are balanced by
# construction and their baseline tables nearly identical. Where a paper
# reports per-arm values, the midpoint is used and the arms' own values are
# noted in `source_note`. Medians and IQRs cannot be pooled exactly; the
# midpoint of two near-identical arms is a good approximation and a poor one
# would be visible as a wide gap between the arms.

# SPECIFICITY ORDER, for assigning the single most relevant guideline per
# patient. Where a patient meets several trials, the most *specific* one wins --
# specificity being the trial that enrolled the smallest share of a shock
# cohort. SOAP II would otherwise take almost everyone by covering 89% of them,
# and a recommendation that applies to nearly all shock is the least informative
# thing one could say about any particular patient.
#
# TRANSFERRED, NOT RECOMPUTED, for the same reason the phenotype models in
# models/ are. `assign_guideline` used to derive this ordering from whatever
# frame it was handed, which was fine while it only ever ran once on the pooled
# cohort. Run site-side it is not: the eligible shares genuinely reorder between
# sites -- 65 trial 15.6% vs OptimaCC 10.8% at NU, against 11.8% vs 28.3% at
# Rush -- so the same patient profile would be assigned a different guideline
# depending on which hospital scored it, and the pooled breakdown would not mean
# anything. Three trials also tie exactly at 15.5% (SHOCK, IABP-SHOCK II,
# CULPRIT-SHOCK) and four of the septic trials tie at 24.2%, which a local sort
# would break arbitrarily.
#
# Most specific first. Derived from the 39,819-patient pooled cohort at the
# 24h anchor. The trials stage logs the ordering it would derive from whatever
# cohort it is run on, so to regenerate: run 01 at the derivation site, take the
# "specificity ranked on THIS cohort" line out of the log, and commit it -- so
# the ordering and the code that reads it move together. Every site logs the
# same line, which is also how far its own eligible shares have drifted from the
# order being applied to it.
specificity_order:
  - crash_2            # 0.0%  -- trauma haemorrhage, essentially disjoint here
  - danger_shock       # 1.2%
  - villanueva         # 1.7%
  - ecls_shock         # 3.7%
  - adrenal            # 10.0%
  - sixtyfive          # 13.5%
  - optimacc           # 14.1%
  - shock              # 15.5%  tie
  - iabp_shock_ii      # 15.5%  tie -- same ACS-with-CS gate as SHOCK
  - culprit_shock      # 15.5%  tie
  - vasst              # 20.3%
  - ecmo_cs            # 22.6%
  - sepsispam          # 24.2%  tie
  - smart              # 24.2%  tie
  - aprocchss          # 24.2%  tie
  - classic            # 24.2%  tie
  - clovers            # 25.3%
  - soap_ii            # 89.0%  -- excluded from the assignment entirely

trials:

  # -------------------------------------------------------------- SHOCK 1999
  shock:
    label: SHOCK
    year: !!int 1999
    intervention: early revascularisation (PCI/CABG)
    guideline: >-
      Emergency culprit-vessel revascularisation in ACS with cardiogenic shock
      (2025 ACC/AHA/ACEP/NAEMSP/SCAI ACS guideline; 2023 ESC ACS guideline)
    citation: Hochman JS et al. N Engl J Med 1999;341:625-34
    published:
      n: !!int 302
      age_mean: !!float 66.0
      age_sd: !!float 10.0
      age_median: null
      pct_female: !!float 0.32
      lactate_median: null
      sbp_median: null
      lvef_median: null
      mortality_control: !!float 0.561 # 30-day, medical stabilisation arm
      source_note: >-
        Age and sex from the NEJM abstract. Per-arm baseline values were not
        retrievable without journal access; no lactate or SBP reported.
    # SHOCK published no interquartile ranges at all, so age's is approximated
    # from the reported mean 66 (SD 10) as mean +/- 0.674 SD, which holds only
    # if age is near-normal. Flagged, and it is the only quartile this trial
    # contributes.
    table1:
      age_at_admission:
        {median: !!float 66.0, iqr: [!!float 59.3, !!float 72.7], approximate: !!bool true}
      male: {pct: !!float 0.68}

  # ------------------------------------------------------- IABP-SHOCK II 2012
  iabp_shock_ii:
    label: IABP-SHOCK II
    year: !!int 2012
    intervention: intra-aortic balloon counterpulsation
    guideline: >-
      Against routine IABP in cardiogenic shock without mechanical
      complications (ESC HF 2016 Class III B; carried into 2023 ESC ACS)
    citation: Thiele H et al. N Engl J Med 2012;367:1287-96
    published:
      n: !!int 600
      age_mean: null
      age_sd: null
      age_median: !!float 70.0
      pct_female: !!float 0.31
      lactate_median: null
      sbp_median: null
      lvef_median: !!float 35.0
      mortality_control: !!float 0.414 # 30-day, control arm
      source_note: >-
        Median age and LVEF from the ACC trial summary; female share 31% from
        the trial's sex substudy (187 of 600). Diabetes share not confirmed.
    # N Engl J Med 2012;367:1287-96, Table 1, first page. Arms are (IABP,
    # N=301) and (control, N=299); values below are the midpoint for medians
    # and IQRs, and the pooled numerator over the pooled denominator for
    # proportions (the paper gives no./total no., and the totals differ by row).
    #
    # The haemodynamic and laboratory rows -- systolic pressure, heart rate,
    # lactate, ejection fraction -- are on the table's second page and are not
    # transcribed here, so this trial gets no hypotension comparison of the
    # kind ECLS-SHOCK and DanGer Shock support. Adding that page would need no
    # code change.
    table1:
      age_at_admission: {median: !!float 69.5, iqr: [!!float 58.0, !!float 77.0]}
      weight_kg: {median: !!float 80.5, iqr: [!!float 73.0, !!float 90.0]}
      height_cm: {median: !!float 173.5, iqr: [!!float 166.5, !!float 179.0]}
      bmi: {median: !!float 27.2, iqr: [!!float 24.7, !!float 29.75]}
      male: {pct: !!float 0.688}
      dx_hypertension: {pct: !!float 0.692}
      dx_diabetes: {pct: !!float 0.327}
      dx_prior_mi: {pct: !!float 0.220}
      dx_stroke: {pct: !!float 0.073}
      dx_severe_pvd: {pct: !!float 0.122}
      dx_prior_pci: {pct: !!float 0.192}
      dx_prior_cabg: {pct: !!float 0.053}

  # ------------------------------------------------------ CULPRIT-SHOCK 2017
  culprit_shock:
    label: CULPRIT-SHOCK
    year: !!int 2017
    intervention: culprit-lesion-only PCI (vs immediate multivessel)
    guideline: >-
      Against routine immediate non-infarct-artery PCI in ACS with cardiogenic
      shock (2025 ACC/AHA ACS guideline; staged non-IRA PCI IIa C in 2023 ESC)
    citation: Thiele H et al. N Engl J Med 2017;377:2419-32
    published:
      n: !!int 706
      age_mean: null
      age_sd: null
      age_median: !!float 70.0
      pct_female: !!float 0.25
      lactate_median: null
      sbp_median: null
      lvef_median: null
      mortality_control: !!float 0.516 # 30-day, multivessel arm
      source_note: >-
        Median age 70 and roughly 75% male from secondary summaries of the
        trial; the NEJM Table 1 was not retrievable.
    # N Engl J Med 2017;377:2419-32, Table 1. Arms are (culprit-lesion-only
    # PCI, N=344) and (multivessel PCI, N=342); midpoints for medians and IQRs,
    # pooled numerator over pooled denominator for proportions.
    #
    # Not transferred: oliguria (no intake/output table), left bundle-branch
    # block and anterior STEMI as a share of STEMI (not separable here),
    # "cold, clammy skin and limbs" (not charted), and fibrinolysis.
    table1:
      age_at_admission: {median: !!float 70.0, iqr: [!!float 60.0, !!float 77.5]}
      weight_kg: {median: !!float 80.0, iqr: [!!float 72.5, !!float 90.0]}
      height_cm: {median: !!float 174.5, iqr: [!!float 169.0, !!float 180.0]}
      bmi: {median: !!float 26.65, iqr: [!!float 24.45, !!float 29.4]}
      sbp_at_onset: {median: !!float 100.0, iqr: [!!float 84.0, !!float 125.0]}
      dbp_at_onset: {median: !!float 60.5, iqr: [!!float 50.0, !!float 80.0]}
      map_at_onset: {median: !!float 76.0, iqr: [!!float 63.0, !!float 92.5]}
      male: {pct: !!float 0.765}
      dx_hypertension: {pct: !!float 0.602}
      dx_diabetes: {pct: !!float 0.323}
      dx_prior_mi: {pct: !!float 0.168}
      dx_stroke: {pct: !!float 0.072}
      dx_severe_pvd: {pct: !!float 0.118}
      dx_prior_pci: {pct: !!float 0.188}
      dx_prior_cabg: {pct: !!float 0.049}
      dx_stemi: {pct: !!float 0.624}
      dx_cardiac_arrest: {pct: !!float 0.536}
      ams_gcs_lt15: {pct: !!float 0.676}
      met_lactate: {pct: !!float 0.663} # arterial lactate > 2.0 mmol/L

  # ----------------------------------------------------------- SOAP II 2010
  soap_ii:
    label: SOAP II (CS subgroup)
    year: !!int 2010
    intervention: norepinephrine rather than dopamine as first vasopressor
    guideline: >-
      Norepinephrine preferred as first-line vasopressor in cardiogenic shock
      (2025 ACC CS consensus; ESC HF 2021)
    citation: De Backer D et al. N Engl J Med 2010;362:779-89
    published:
      n: !!int 280 # cardiogenic subgroup of 1,679 randomised
      age_mean: null
      age_sd: null
      age_median: null
      pct_female: null
      lactate_median: null
      sbp_median: null
      lvef_median: null
      mortality_control: null
      source_note: >-
        The 280 is the prespecified cardiogenic subgroup, and the table below
        is NOT its baseline -- see the warning there.

    # N Engl J Med 2010;362:779-89, Table 1. Arms are (dopamine, N=858) and
    # (norepinephrine, N=821); midpoints for medians and IQRs, pooled numerator
    # over 1,679 for proportions.
    #
    # READ THIS BEFORE THE COMPARISON. These are the baseline characteristics
    # of the WHOLE TRIAL: 1,679 patients of whom 62.2% had septic shock, 16.7%
    # a cardiogenic source and 15.7% hypovolaemia. The recommendation this
    # trial supports for cardiogenic shock rests on the 280-patient cardiogenic
    # subgroup, whose baseline characteristics the paper never published. So
    # this row set describes a predominantly septic population and our
    # comparison against it is between different diseases -- the only trial
    # here where that is true. The counts confirm the subgroup size (135 + 145
    # = 280) and nothing else about it.
    #
    # Temperature, heart rate and mean arterial pressure are reported as
    # mean +/- SD rather than median (IQR), so their quartiles are approximated
    # as mean +/- 0.674 SD and flagged. Heart rate pools 97+/-27 and 95+/-25.
    #
    # Not transferred: APACHE II and SOFA (not computed in this pipeline),
    # reason for admission, mean pulmonary-artery pressure (no catheter data).
    table1:
      age_at_admission: {median: !!float 67.5, iqr: [!!float 55.5, !!float 76.0]}
      map_at_onset:
        {median: !!float 58.0, iqr: [!!float 49.2, !!float 66.8], approximate: !!bool true}
      heart_rate_at_onset:
        {median: !!float 96.0, iqr: [!!float 78.5, !!float 113.5], approximate: !!bool true}
      temp_at_onset:
        {median: !!float 36.6, iqr: [!!float 35.6, !!float 37.6], approximate: !!bool true}
      male: {pct: !!float 0.569}

  # --------------------------------------------------------- OptimaCC 2018
  optimacc:
    label: OptimaCC
    year: !!int 2018
    intervention: norepinephrine rather than epinephrine
    guideline: >-
      Against epinephrine as first-line vasopressor in AMI-related cardiogenic
      shock (2025 ACC CS consensus)
    citation: Levy B et al. J Am Coll Cardiol 2018;72:173-82
    published:
      n: !!int 57
      age_mean: null
      age_sd: null
      age_median: null
      pct_female: !!float 0.34
      lactate_median: null
      sbp_median: null
      lvef_median: null
      mortality_control: null
      source_note: >-
        57 patients, stopped early for excess refractory shock on epinephrine.
        Sex was imbalanced between arms (48% vs 20% female), so the pooled
        figure averages over a randomisation that did not balance.

    # J Am Coll Cardiol 2018;72:173-82, Table 1. Arms are (epinephrine, n=27)
    # and (norepinephrine, n=30); midpoints for medians and IQRs, pooled
    # numerator over 57 for proportions.
    #
    # The smallest trial here by an order of magnitude, so every proportion
    # moves in steps of 1.8 points and the IQRs are wide. Read the comparison
    # as indicative.
    #
    # Lactate is the one row where the arms genuinely differ -- 5.00
    # (2.70-6.06) against 2.93 (1.94-4.82), p = 0.068 -- so the midpoint is a
    # poor summary of either and is marked approximate.
    #
    # Not transferred: SAPS 2 (not computed here), left ventricular ejection
    # fraction (no echo), duration of shock before randomisation, and
    # vasopressor treatment before inclusion (ours is support at or after
    # onset, not before it, so the two are not the same quantity).
    table1:
      age_at_admission: {median: !!float 67.0, iqr: [!!float 55.0, !!float 78.0]}
      bmi: {median: !!float 25.3, iqr: [!!float 22.15, !!float 27.5]}
      heart_rate_at_onset: {median: !!float 94.0, iqr: [!!float 72.5, !!float 114.0]}
      sbp_at_onset: {median: !!float 103.5, iqr: [!!float 94.0, !!float 120.5]}
      dbp_at_onset: {median: !!float 55.5, iqr: [!!float 47.5, !!float 63.0]}
      map_at_onset: {median: !!float 71.5, iqr: [!!float 67.5, !!float 81.0]}
      lactate:
        {median: !!float 3.97, iqr: [!!float 2.32, !!float 5.44], approximate: !!bool true}
      male: {pct: !!float 0.667}
      dx_hypertension: {pct: !!float 0.246}
      dx_diabetes: {pct: !!float 0.105}
      dx_stroke: {pct: !!float 0.070}
      dx_prior_mi: {pct: !!float 0.070}
      dx_cardiac_arrest: {pct: !!float 0.509}
      dx_stemi: {pct: !!float 0.965}
      imv_before_onset: {pct: !!float 0.982}

  # -------------------------------------------------------------- ECMO-CS 2022
  ecmo_cs:
    label: ECMO-CS
    year: !!int 2022
    intervention: immediate VA-ECMO (vs early conservative)
    guideline: >-
      Short-term mechanical circulatory support may be considered in refractory
      shock (2023 ESC ACS IIb C); informs ISHLT 2024 HF-CS consensus
    citation: Ostadal P et al. Circulation 2023;147:454-64
    published:
      n: !!int 117
      age_mean: null
      age_sd: null
      age_median: !!float 66.0
      pct_female: !!float 0.25
      lactate_median: !!float 5.0
      sbp_median: null
      lvef_median: null
      mortality_control: null
      source_note: >-
        Median age reported as 67 (immediate) and 65 (conservative); 66 used
        here as the pooled value. Lactate 5.3 / 4.7 mmol/L by arm. Roughly
        three-quarters male. The one trial here with a substantial non-AMI
        population (STEMI 50.4%, heart-failure exacerbation 23.1%).
    # Circulation 2023;147:454-64, Table 2, the "All (N=117)" column -- so no
    # pooling across arms was needed for this one.
    #
    # Not transferred: dilated cardiomyopathy and chronic coronary syndrome (no
    # clean code set), levosimendan (not used at either site), the
    # vasoactive-inotropic score and the per-drug doses (our doses are
    # unit-converted by clifpy for the SOFA subset only, so a dose comparison
    # would not be like for like), intra-aortic balloon pump and renal
    # replacement therapy at randomisation.
    table1:
      age_at_admission: {median: !!float 66.0, iqr: [!!float 59.0, !!float 73.0]}
      lactate: {median: !!float 5.0, iqr: [!!float 3.2, !!float 8.0]}
      sbp_at_onset: {median: !!float 85.0, iqr: [!!float 80.0, !!float 100.0]}
      map_at_onset: {median: !!float 63.3, iqr: [!!float 55.3, !!float 72.0]}
      heart_rate_at_onset: {median: !!float 102.0, iqr: [!!float 84.0, !!float 120.0]}
      male: {pct: !!float 0.735}
      dx_hypertension: {pct: !!float 0.640}
      dx_diabetes: {pct: !!float 0.325}
      dx_heart_failure: {pct: !!float 0.237}
      dx_chronic_kidney_disease: {pct: !!float 0.142}
      dx_severe_pvd: {pct: !!float 0.088}
      dx_stemi: {pct: !!float 0.504}
      # therapy running at randomisation
      imv_before_onset: {pct: !!float 0.723}
      on_norepinephrine: {pct: !!float 0.855}
      on_epinephrine: {pct: !!float 0.034}
      on_dobutamine: {pct: !!float 0.547}
      on_milrinone: {pct: !!float 0.325}
      on_vasopressin: {pct: !!float 0.350}

  # ------------------------------------------------------------ ECLS-SHOCK 2023
  ecls_shock:
    label: ECLS-SHOCK
    year: !!int 2023
    intervention: routine extracorporeal life support
    guideline: >-
      Against routine ECLS in infarct-related cardiogenic shock; the evidence
      behind the IIb framing of short-term MCS in the 2023 ESC ACS guideline
    citation: Thiele H et al. N Engl J Med 2023;389:1286-97
    published:
      n: !!int 417
      age_mean: null
      age_sd: null
      age_median: !!float 63.0
      pct_female: !!float 0.187
      lactate_median: !!float 7.0
      sbp_median: null
      lvef_median: null
      mortality_control: !!float 0.490 # 30-day, control arm
      source_note: >-
        Median age 63 (IQR 56-70), 81.3% men. Lactate ~7 mmol/L. 77.7% had been
        resuscitated before enrolment, and patients over 80 were excluded
        outright -- the narrowest population of any trial here.

    # NEJM 2023;389:1286-97, Table 1. Arms are (ECLS, N=209) and (control,
    # N=208); values below are the midpoint of the two.
    #
    # Not transferred, and why: oliguria (no intake/output table at either
    # site), left ventricular ejection fraction (no echo), number of
    # diseased vessels and infarct-related artery (no coronary anatomy),
    # time to return of spontaneous circulation (arrest is coded, its duration
    # is not), and high-sensitivity troponin T -- UCMC runs troponin-T and NU
    # troponin-I, so one absolute cut is not equivalent across the two sites.
    table1:
      age_at_admission: {median: !!float 62.5, iqr: [!!float 56.5, !!float 70.0]}
      sbp_at_onset: {median: !!float 96.0, iqr: [!!float 80.0, !!float 120.0]}
      dbp_at_onset: {median: !!float 60.5, iqr: [!!float 50.0, !!float 72.0]}
      heart_rate_at_onset: {median: !!float 92.5, iqr: [!!float 73.0, !!float 110.0]}
      lactate: {median: !!float 6.85, iqr: [!!float 4.55, !!float 9.8]}
      ph_at_onset: {median: !!float 7.2, iqr: [!!float 7.1, !!float 7.3]}
      creatinine: {median: !!float 1.25, iqr: [!!float 1.05, !!float 1.55]}
      # 27 (25-30) and 28 (25-31) by arm. An earlier revision of this file
      # claimed weight and height were charted too sparsely to use; that was
      # wrong -- weight is present for 96-100% of this cohort and height for
      # 93-94%.
      bmi: {median: !!float 27.5, iqr: [!!float 25.0, !!float 30.5]}
      male: {pct: !!float 0.8125}
      dx_hypertension: {pct: !!float 0.564}
      dx_diabetes: {pct: !!float 0.314}
      dx_prior_mi: {pct: !!float 0.130}
      dx_stroke: {pct: !!float 0.075}
      # Peripheral artery disease (published 9.0%) is deliberately omitted:
      # severe PVD is an ECLS-SHOCK *exclusion*, so our eligible set is 0% by
      # construction and the comparison measures the filter, not the patients.
      dx_stemi: {pct: !!float 0.672}
      dx_cardiac_arrest: {pct: !!float 0.777}
      ams_gcs_lt15: {pct: !!float 0.954}

  # ----------------------------------------------------------- DanGer Shock 2024
  danger_shock:
    label: DanGer Shock
    year: !!int 2024
    intervention: microaxial flow pump (Impella CP)
    guideline: >-
      First positive randomised evidence for a percutaneous MCS device; informs
      the 2025 ACC CS consensus escalation pathway
    citation: Moller JE et al. N Engl J Med 2024;390:1382-93
    published:
      n: !!int 355
      age_mean: null
      age_sd: null
      age_median: !!float 67.0
      pct_female: !!float 0.208
      lactate_median: !!float 4.5
      sbp_median: !!float 83.0
      lvef_median: !!float 25.0
      mortality_control: !!float 0.585 # 180-day, standard-care arm
      source_note: >-
        Median age 67 (67 vs 69 by arm), 79.2% men, lactate 4.5-4.6 mmol/L,
        SBP 82-84 mmHg, LVEF 25%. STEMI only, and patients comatose after
        out-of-hospital arrest were excluded.

    # NEJM 2024;390:1382-93, Table 1. Arms are (microaxial flow pump + standard
    # care, N=179) and (standard care alone, N=176); values below are the
    # midpoint of the two, which differ by at most 2 units on any continuous
    # variable.
    table1:
      age_at_admission: {median: !!float 68.0, iqr: [!!float 59.0, !!float 76.0]}
      sbp_at_onset: {median: !!float 83.0, iqr: [!!float 72.0, !!float 91.0]}
      map_at_onset: {median: !!float 63.5, iqr: [!!float 55.0, !!float 72.5]}
      heart_rate_at_onset: {median: !!float 94.5, iqr: [!!float 76.5, !!float 110.5]}
      lactate: {median: !!float 4.55, iqr: [!!float 3.3, !!float 7.0]}
      # LVEF 25% (IQR 20-31 / 15-30) is reported but not computable here --
      # neither site has an echo table -- so it is deliberately omitted rather
      # than left to be silently skipped.
      male: {pct: !!float 0.792}
      dx_hypertension: {pct: !!float 0.515}
      dx_diabetes: {pct: !!float 0.225}
      dx_prior_mi: {pct: !!float 0.161}
      dx_heart_failure: {pct: !!float 0.093}
      dx_chronic_kidney_disease: {pct: !!float 0.099}
      dx_cardiac_arrest: {pct: !!float 0.203} # resuscitation before randomisation
      imv_before_onset: {pct: !!float 0.178} # intubation before randomisation
      dx_anterior_mi: {pct: !!float 0.719}

  # ===================================================== SEPTIC SHOCK
  #
  # The Surviving Sepsis Campaign is a guideline, not a trial, so what is
  # listed here are the trials its recommendations rest on. Eligibility is
  # gated on a coded septic shock diagnosis rather than on a Sepsis-3
  # derivation -- that derivation lives in the sibling CLIF-latent-septicshock
  # repository, and reproducing it here would duplicate it badly.

  sepsispam:
    label: SEPSISPAM
    year: !!int 2014
    applies_to: septic
    intervention: mean arterial pressure target of 65-70 rather than 80-85 mmHg
    guideline: >-
      Initial MAP target of 65 mmHg in septic shock on vasopressors
      (Surviving Sepsis Campaign 2021, strong recommendation, moderate evidence)
    citation: Asfar P et al. N Engl J Med 2014;370:1583-93
    published:
      n: !!int 776
      age_median: null
      pct_female: null
      lactate_median: null
      sbp_median: null
      lvef_median: null
      mortality_control: null
      source_note: >-
        776 patients, 29 French centres. No mortality difference at 28 or 90
        days between the two targets. Baseline SAPS II about 56-57 and SOFA
        about 10.7-10.8 in both arms. A clean median age and lactate were not
        retrievable without journal access -- the figures that surfaced were
        flagged as possibly conflated with another trial -- so no `table1`
        block is given rather than an unverified one.
    # The placeholder block that replaces "no block at all". The reasoning
    # in the source_note above stands -- the values that surfaced were not
    # trustworthy -- and the difference is only that the gap is now itemised
    # and shows up in the verification checklist instead of being invisible.
    table1:
      age_at_admission: {median: null, iqr: null, verify: !!bool true}
      male: {pct: null, verify: !!bool true}
      sofa_total: {median: null, iqr: null, verify: !!bool true}
      lactate: {median: null, iqr: null, verify: !!bool true}
      map_at_onset: {median: null, iqr: null, verify: !!bool true}
      creatinine: {median: null, iqr: null, verify: !!bool true}
      imv_before_onset: {pct: null, verify: !!bool true}

  vasst:
    label: VASST
    year: !!int 2008
    applies_to: septic
    intervention: vasopressin added to norepinephrine
    guideline: >-
      Add vasopressin rather than escalating norepinephrine when MAP is
      inadequate (Surviving Sepsis Campaign 2021)
    citation: Russell JA et al. N Engl J Med 2008;358:877-87
    published:
      n: !!int 778
      age_median: null
      pct_female: null
      lactate_median: null
      sbp_median: null
      lvef_median: null
      mortality_control: null
      source_note: >-
        778 patients. No overall mortality difference; a prespecified
        less-severe stratum favoured vasopressin. Table 1 not transcribed.
    # VASST reported a SOFA-defined severity stratification, which is the
    # axis its one positive subgroup sat on, so sofa_total matters more here
    # than the usual baseline row.
    table1:
      age_at_admission: {median: null, iqr: null, verify: !!bool true}
      male: {pct: null, verify: !!bool true}
      sofa_total: {median: null, iqr: null, verify: !!bool true}
      lactate: {median: null, iqr: null, verify: !!bool true}
      map_at_onset: {median: null, iqr: null, verify: !!bool true}
      on_norepinephrine: {pct: null, verify: !!bool true}
      imv_before_onset: {pct: null, verify: !!bool true}

  adrenal:
    label: ADRENAL
    year: !!int 2018
    applies_to: septic
    intervention: hydrocortisone infusion
    guideline: >-
      Hydrocortisone for septic shock with an ongoing vasopressor requirement
      (Surviving Sepsis Campaign 2021, weak recommendation)
    citation: Venkatesh B et al. N Engl J Med 2018;378:797-808
    published:
      n: !!int 3800
      age_median: null
      pct_female: null
      lactate_median: null
      sbp_median: null
      lvef_median: null
      mortality_control: null
      source_note: >-
        3,800 patients, the largest trial in this file. No 90-day mortality
        difference; faster shock resolution with hydrocortisone. Table 1 not
        transcribed.
    # Fill this one alongside APROCCHSS. The two tested nearly the same
    # intervention and disagreed, and the usual explanation is that their
    # populations differed in severity -- which is exactly what comparing
    # both baseline tables against our eligible patients would show.
    table1:
      age_at_admission: {median: null, iqr: null, verify: !!bool true}
      male: {pct: null, verify: !!bool true}
      sofa_total: {median: null, iqr: null, verify: !!bool true}
      lactate: {median: null, iqr: null, verify: !!bool true}
      map_at_onset: {median: null, iqr: null, verify: !!bool true}
      creatinine: {median: null, iqr: null, verify: !!bool true}
      imv_before_onset: {pct: null, verify: !!bool true}
      on_norepinephrine: {pct: null, verify: !!bool true}

  # The five trials below were added to cover the Surviving Sepsis
  # recommendations the cardiogenic-shock set did not reach: a second mean
  # arterial pressure target trial, the two fluid-strategy trials, the
  # crystalloid-type trial, and the second steroid trial.
  #
  # EVERY NUMBER IN THEIR `published` AND `table1` BLOCKS IS A PLACEHOLDER.
  # They were written from the papers' identity, not their contents, and carry
  # `verify: true` on each entry. Nothing downstream reads a flagged entry --
  # clifcs.trials.load_trials drops them -- so an unfilled placeholder makes a
  # trial contribute eligibility and no population comparison, which is the
  # same state SEPSISPAM was already in. `table1_to_verify` emits the checklist
  # of what is outstanding.
  #
  # To fill one in: replace the nulls with the paper's values and delete the
  # `verify: true`. Leaving the flag on a filled value is itself warned about
  # at load time, so neither half of the edit can be forgotten silently.

  smart:
    label: SMART
    year: !!int 2018
    applies_to: septic
    intervention: balanced crystalloid rather than saline
    guideline: >-
      Balanced crystalloids rather than 0.9% saline for resuscitation in sepsis
      and septic shock (Surviving Sepsis Campaign 2021, weak recommendation,
      low evidence)
    citation: Semler MW et al. N Engl J Med 2018 (volume and pages to verify)
    citation_verified: !!bool false
    published:
      n: null
      age_median: null
      pct_female: null
      lactate_median: null
      sbp_median: null
      lvef_median: null
      mortality_control: null
      source_note: >-
        PLACEHOLDER. SMART randomised ICU patients at a single centre by unit
        crossover to balanced crystalloid or saline, with a major adverse
        kidney event composite as the primary outcome. Counts, baseline values
        and the control-arm outcome are not transcribed.
    # THE INTERVENTION IS NOT ASCERTAINABLE HERE, and unlike the duration and
    # dose approximations elsewhere in this file that is absolute rather than
    # partial. Neither site's extract carries a balanced crystalloid at all:
    # the continuous medication categories include `sodium chloride` and
    # `dextrose` and no lactated Ringer's or Plasma-Lyte, and there is no
    # intake/output table to carry volumes. So SMART is in the same position as
    # CRASH-2 -- eligibility and the population comparison are available, the
    # "was it followed" arm is not -- except that here the population is ours.
    table1:
      age_at_admission: {median: null, iqr: null, verify: !!bool true}
      male: {pct: null, verify: !!bool true}
      sofa_total: {median: null, iqr: null, verify: !!bool true}
      creatinine: {median: null, iqr: null, verify: !!bool true}
      map_at_onset: {median: null, iqr: null, verify: !!bool true}
      imv_before_onset: {pct: null, verify: !!bool true}

  aprocchss:
    label: APROCCHSS
    year: !!int 2018
    applies_to: septic
    intervention: hydrocortisone plus fludrocortisone
    guideline: >-
      Hydrocortisone for septic shock with an ongoing vasopressor requirement
      (Surviving Sepsis Campaign 2021, weak recommendation). Paired with
      ADRENAL, which tested hydrocortisone alone and was neutral where this
      trial was positive.
    citation: Annane D et al. N Engl J Med 2018 (volume and pages to verify)
    citation_verified: !!bool false
    published:
      n: null
      age_median: null
      pct_female: null
      lactate_median: null
      sbp_median: null
      lvef_median: null
      mortality_control: null
      source_note: >-
        PLACEHOLDER. APROCCHSS enrolled septic shock on vasopressors in French
        ICUs and reported a 90-day mortality benefit. Its population was
        sicker than ADRENAL's, which is the usual explanation offered for the
        two trials disagreeing -- so the baseline table matters more here than
        for most of this file, and should be filled before the pair is read
        against each other.
    # The one trial in this file whose intervention is MORE ascertainable than
    # its partner's: both `hydrocortisone` and `fludrocortisone` are
    # medication categories at both sites, so the two-drug regimen this trial
    # tested can be distinguished from ADRENAL's hydrocortisone alone. See
    # `on_fludrocortisone` in clifcs.trials.attach_features.
    table1:
      age_at_admission: {median: null, iqr: null, verify: !!bool true}
      male: {pct: null, verify: !!bool true}
      sofa_total: {median: null, iqr: null, verify: !!bool true}
      lactate: {median: null, iqr: null, verify: !!bool true}
      map_at_onset: {median: null, iqr: null, verify: !!bool true}
      creatinine: {median: null, iqr: null, verify: !!bool true}
      imv_before_onset: {pct: null, verify: !!bool true}
      on_norepinephrine: {pct: null, verify: !!bool true}

  sixtyfive:
    label: 65 trial
    year: !!int 2020
    applies_to: septic
    intervention: permissive hypotension, a mean arterial pressure target of 60-65 mmHg
    guideline: >-
      Initial MAP target of 65 mmHg in septic shock on vasopressors (Surviving
      Sepsis Campaign 2021, strong recommendation, moderate evidence). The
      companion to SEPSISPAM, in patients 65 and over.
    citation: Lamontagne F et al. JAMA 2020 (volume and pages to verify)
    citation_verified: !!bool false
    published:
      n: null
      age_median: null
      pct_female: null
      lactate_median: null
      sbp_median: null
      lvef_median: null
      mortality_control: null
      source_note: >-
        PLACEHOLDER. A pragmatic multicentre trial of permissive hypotension in
        vasodilatory shock in patients aged 65 or over. Of the sepsis trials
        here it is the one whose enrolment is most nearly reproducible from
        this cohort -- age and vasopressor use are both directly available --
        so its population comparison should be among the most trustworthy once
        filled.
    table1:
      age_at_admission: {median: null, iqr: null, verify: !!bool true}
      male: {pct: null, verify: !!bool true}
      sofa_total: {median: null, iqr: null, verify: !!bool true}
      lactate: {median: null, iqr: null, verify: !!bool true}
      map_at_onset: {median: null, iqr: null, verify: !!bool true}
      imv_before_onset: {pct: null, verify: !!bool true}

  classic:
    label: CLASSIC
    year: !!int 2022
    applies_to: septic
    intervention: restrictive intravenous fluid therapy
    guideline: >-
      Fluid strategy after initial resuscitation in septic shock (Surviving
      Sepsis Campaign 2021 recommends against large-volume fluid beyond the
      initial resuscitation; this trial and CLOVERS are the evidence that
      followed)
    citation: Meyhoff TS et al. N Engl J Med 2022 (volume and pages to verify)
    citation_verified: !!bool false
    published:
      n: null
      age_median: null
      pct_female: null
      lactate_median: null
      sbp_median: null
      lvef_median: null
      mortality_control: null
      source_note: >-
        PLACEHOLDER. Restrictive versus standard intravenous fluid in adult ICU
        patients with septic shock who had already received at least a litre;
        neutral for 90-day mortality.
    # THE INTERVENTION IS NOT ASCERTAINABLE HERE. The trial's arms are defined
    # by fluid volume and there is no intake/output table at either site, which
    # is the same limit that stops SEPSISPAM's fluid-resuscitation prerequisite
    # from being applied. Eligibility is therefore a superset on the "already
    # resuscitated" criterion and concordance is unavailable.
    table1:
      age_at_admission: {median: null, iqr: null, verify: !!bool true}
      male: {pct: null, verify: !!bool true}
      sofa_total: {median: null, iqr: null, verify: !!bool true}
      lactate: {median: null, iqr: null, verify: !!bool true}
      map_at_onset: {median: null, iqr: null, verify: !!bool true}
      creatinine: {median: null, iqr: null, verify: !!bool true}
      imv_before_onset: {pct: null, verify: !!bool true}

  clovers:
    label: CLOVERS
    year: !!int 2023
    applies_to: septic
    intervention: vasopressor-first rather than fluid-liberal resuscitation
    guideline: >-
      Fluid versus early vasopressor strategy in sepsis-induced hypotension
      (the trial that, with CLASSIC, tested what the Surviving Sepsis Campaign
      2021 fluid recommendation left open)
    citation: NHLBI PETAL Network. N Engl J Med 2023 (volume and pages to verify)
    citation_verified: !!bool false
    published:
      n: null
      age_median: null
      pct_female: null
      lactate_median: null
      sbp_median: null
      lvef_median: null
      mortality_control: null
      source_note: >-
        PLACEHOLDER. Restrictive fluid with early vasopressor versus liberal
        fluid in sepsis-induced hypotension refractory to initial fluid;
        stopped for futility.
    # THE INTERVENTION IS NOT ASCERTAINABLE HERE, for the same reason as
    # CLASSIC: the arms are a fluid volume against a vasopressor start time,
    # and only the second half of that is visible. `vasoactive_onset_dttm` is
    # on the cohort, so a *partial* concordance measure -- how early the
    # vasopressor started -- is possible in a way it is not for CLASSIC, but it
    # is half the contrast and is not implemented as concordance.
    table1:
      age_at_admission: {median: null, iqr: null, verify: !!bool true}
      male: {pct: null, verify: !!bool true}
      sofa_total: {median: null, iqr: null, verify: !!bool true}
      lactate: {median: null, iqr: null, verify: !!bool true}
      map_at_onset: {median: null, iqr: null, verify: !!bool true}
      sbp_at_onset: {median: null, iqr: null, verify: !!bool true}
      imv_before_onset: {pct: null, verify: !!bool true}

  # ================================================= HYPOVOLAEMIC SHOCK
  #
  # CONCORDANCE CANNOT BE ASSESSED FOR ANY OF THESE, and it is a data limit
  # rather than a judgement. Every one of them turns on a blood product or on
  # tranexamic acid: neither site's CLIF-2.1 extract has a transfusion or blood
  # product table, and tranexamic acid is not a med_category at either. So
  # eligibility and the population comparison are available and the "was it
  # followed" arm is not, for all of them.

  villanueva:
    label: Villanueva (UGIB transfusion)
    year: !!int 2013
    applies_to: hypovolemic
    intervention: restrictive transfusion threshold, haemoglobin < 7 g/dL
    guideline: >-
      Restrictive transfusion in acute upper gastrointestinal bleeding; the
      trial closest to this cohort's hypovolaemic patients, who are largely
      gastrointestinal bleeding rather than trauma
    citation: Villanueva C et al. N Engl J Med 2013;368:11-21
    published:
      n: !!int 921
      age_median: null
      pct_female: null
      lactate_median: null
      sbp_median: null
      lvef_median: null
      mortality_control: null
      source_note: >-
        921 randomised, 889 analysed. 31% had cirrhosis. Lower further bleeding
        and lower 45-day mortality with the restrictive strategy. Table 1 not
        transcribed; the trial reports Rockall score, MELD and Child-Pugh, none
        of which this pipeline computes.
    # A deliberately short block. The trial's own baseline table is built on
    # Rockall, MELD and Child-Pugh, none of which this pipeline computes, and
    # its haemoglobin rows have no counterpart either -- haemoglobin is not a
    # cohort column. What is left is demographics and the shared physiology,
    # so this trial will always have a small `n_compared` and should be read
    # as the weakest population comparison in the file.
    table1:
      age_at_admission: {median: null, iqr: null, verify: !!bool true}
      male: {pct: null, verify: !!bool true}
      sbp_at_onset: {median: null, iqr: null, verify: !!bool true}
      heart_rate_at_onset: {median: null, iqr: null, verify: !!bool true}
      creatinine: {median: null, iqr: null, verify: !!bool true}

  crash_2:
    label: CRASH-2
    year: !!int 2010
    applies_to: hypovolemic
    intervention: tranexamic acid within 3 h of injury
    guideline: >-
      Tranexamic acid in traumatic haemorrhage (European trauma guideline, 6th
      edition). Included for completeness and flagged: its population is
      20,211 trauma patients across 40 countries, which this cohort's
      hypovolaemic patients are not.
    citation: CRASH-2 collaborators. Lancet 2010;376:23-32
    published:
      n: !!int 20211
      age_median: null
      pct_female: null
      lactate_median: null
      sbp_median: null
      lvef_median: null
      mortality_control: null
      source_note: >-
        20,211 patients. Mortality benefit when given within 3 h and harm after
        it. Injury severity was not described by arm, a documented limitation.
        Tranexamic acid is not recorded as a med_category at either site, so
        neither the intervention nor concordance is ascertainable here.

# ------------------------------------------------------- region and orphan rule
regions:
  # Trial regions are fitted in the PCA subspace of the embeddings rather than
  # in the 2-d projection: a neighbour-graph layout is not metric, so a
  # Mahalanobis radius measured in it would not mean anything.
  pca_components: !!int 50

  # A region needs enough eligible patients for its covariance to be estimable.
  # Below this it is reported but not fitted, and no distances are produced.
  min_eligible: !!int 50

  # Neighbours for the affinity measure. 30 matches the k that 03 uses for
  # neighbourhood purity, so the two numbers are measured over the same
  # neighbourhood size and can be read against each other.
  neighbours: !!int 30

  # An ineligible patient "resembles" a trial's population when their
  # neighbourhood holds more trial-eligible patients than chance would put
  # there: the upper binomial tail at the trial's base rate, below this alpha.
  #
  # A fixed percentile was tried first and degenerates for the rare trials.
  # DanGer Shock covers 0.6% of the cohort, so nearly every ineligible patient
  # has zero eligible neighbours, the 95th percentile of that sits at one
  # neighbour in thirty, and 4,381 patients were called "inside the DanGer
  # Shock region" on one neighbour -- which is simply what chance gives. The
  # binomial rule raises the bar as prevalence falls.
  enrichment_alpha: !!float 0.01

  # NOTE: there is deliberately no covariance parameter here. Regions share one
  # whitening fitted on the whole cohort rather than each carrying its own
  # covariance -- scaling a region by its own spread makes every region the same
  # size (the distance concentrates at sqrt(d)), which is how the first version
  # of this analysis produced eight identical radii. See clifcs.trials.whiten.

# --------------------------------------------------- inclusion and exclusion
# Each trial's criteria as published, with whether this pipeline can apply
# each one. `applied` is yes / partly / no, and the note says what is given
# up. Read this before any eligibility count: a `no` on a substantive
# criterion means the count is a superset, sometimes a large one.
#
# This is prose, kept in the config so it sits beside the numbers it
# qualifies and can be checked against the paper without reading code.
criteria:
  sepsispam:
    - kind: inclusion
      criterion: 'septic shock requiring a vasopressor despite fluid resuscitation'
      applied: 'partly'
      note: 'coded septic shock plus a vasopressor; the fluid criterion is not computable'
    - kind: exclusion
      criterion: 'age < 18, pregnancy, chronic hypertension excluded from high-target arm'
      applied: 'partly'
      note: 'age yes; the rest not'
  vasst:
    - kind: inclusion
      criterion: 'septic shock on norepinephrine >= 5 mcg/min for 6 h'
      applied: 'partly'
      note: 'coded septic shock plus norepinephrine; the dose-duration threshold is not applied'
    - kind: exclusion
      criterion: 'acute coronary syndrome, severe heart failure'
      applied: 'partly'
      note: 'AMI code yes; heart failure severity no'
  adrenal:
    - kind: inclusion
      criterion: 'septic shock, mechanically ventilated, on a vasopressor for >= 4 h'
      applied: 'partly'
      note: 'coded septic shock, ventilation and vasopressor yes; the 4 h duration is not applied'
    - kind: exclusion
      criterion: 'already receiving systemic corticosteroids for another indication'
      applied: 'no'
      note: 'the indication for a steroid is not recorded'
  villanueva:
    - kind: inclusion
      criterion: 'acute upper gastrointestinal bleeding with haematemesis or melaena'
      applied: 'partly'
      note: 'coded hypovolaemic shock with a gastrointestinal bleeding diagnosis'
    - kind: exclusion
      criterion: 'exsanguinating bleeding, acute coronary syndrome, recent trauma or surgery'
      applied: 'partly'
      note: 'AMI code yes; the others not'
    - kind: inclusion
      criterion: 'transfusion threshold applied at haemoglobin 7 vs 9 g/dL'
      applied: 'no'
      note: 'no transfusion or blood product table at either site, so the intervention is invisible'
  crash_2:
    - kind: inclusion
      criterion: 'adult trauma with significant haemorrhage, within 8 h of injury'
      applied: 'no'
      note: 'trauma is not reliably identifiable and time from injury is not recorded'
    - kind: inclusion
      criterion: 'tranexamic acid within 3 h'
      applied: 'no'
      note: 'tranexamic acid is not a med_category at either site'
  shock:
    - kind: inclusion
      criterion: 'acute MI with ST elevation or new LBBB, or posterior infarction'
      applied: 'yes'
      note: 'ICD-coded acute MI'
    - kind: inclusion
      criterion: 'cardiogenic shock from predominant left ventricular failure'
      applied: 'partly'
      note: 'shock yes; LV failure as the cause needs an echo, which neither site has'
    - kind: inclusion
      criterion: 'SBP < 90 mmHg for >= 30 min, or support to keep SBP >= 90'
      applied: 'yes'
      note: 'criterion 1 of this cohort'
    - kind: inclusion
      criterion: 'end-organ hypoperfusion'
      applied: 'yes'
      note: 'criterion 2 of this cohort'
    - kind: exclusion
      criterion: 'mechanical cause of shock, severe systemic illness'
      applied: 'no'
      note: 'not ascertainable'
  soap_ii:
    - kind: inclusion
      criterion: 'shock requiring a vasopressor'
      applied: 'yes'
      note: 'continuous vasoactive infusion'
    - kind: inclusion
      criterion: 'adequate fluid resuscitation given'
      applied: 'no'
      note: 'no intake/output table at either site'
    - kind: exclusion
      criterion: 'age < 18, already on a vasopressor > 4 h'
      applied: 'partly'
      note: 'age yes; prior-vasopressor duration not timed'
  iabp_shock_ii:
    - kind: inclusion
      criterion: 'acute MI (STEMI or NSTEMI) planned for early revascularisation'
      applied: 'partly'
      note: 'MI yes; the revascularisation plan is not recorded'
    - kind: inclusion
      criterion: 'cardiogenic shock: SBP < 90 for > 30 min or catecholamines to maintain > 90'
      applied: 'yes'
      note: 'criterion 1 of this cohort'
    - kind: inclusion
      criterion: 'pulmonary congestion and impaired end-organ perfusion'
      applied: 'partly'
      note: 'end-organ yes; congestion needs imaging'
    - kind: exclusion
      criterion: 'resuscitation > 30 min, no intrinsic heart action, severe PAD'
      applied: 'partly'
      note: 'severe PAD yes; resuscitation duration is not timed'
    - kind: exclusion
      criterion: 'age > 90, shock > 12 h, mechanical cause'
      applied: 'partly'
      note: 'age and shock duration yes; mechanical cause no'
  culprit_shock:
    - kind: inclusion
      criterion: 'acute MI, STEMI or NSTEMI'
      applied: 'yes'
      note: 'ICD-coded acute MI'
    - kind: inclusion
      criterion: 'multivessel coronary disease, >= 70% stenosis in >= 2 major vessels'
      applied: 'no'
      note: 'no coronary anatomy in CLIF 2.1 -- the criterion that most inflates this eligible set'
    - kind: inclusion
      criterion: 'cardiogenic shock, planned for PCI'
      applied: 'yes'
      note: 'criterion 1 of this cohort'
    - kind: exclusion
      criterion: 'resuscitation > 45 min, mechanical cause, age > 90'
      applied: 'partly'
      note: 'age yes; resuscitation duration not timed'
  optimacc:
    - kind: inclusion
      criterion: 'cardiogenic shock after successful PCI for acute MI'
      applied: 'partly'
      note: 'MI with shock yes; PCI and its success are not recorded'
    - kind: inclusion
      criterion: 'cardiac index < 2.2 and need for a vasopressor'
      applied: 'partly'
      note: 'vasopressor yes; cardiac index is not measured here'
    - kind: exclusion
      criterion: 'other cause of shock'
      applied: 'yes'
      note: 'shock type is labelled from diagnoses'
  ecmo_cs:
    - kind: inclusion
      criterion: 'rapidly deteriorating or severe cardiogenic shock'
      applied: 'partly'
      note: 'vasopressor plus lactate > 3 stands in for severity'
    - kind: inclusion
      criterion: 'haemodynamic criteria: cardiac index, SvO2, or escalating pressors'
      applied: 'no'
      note: 'cardiac index and SvO2 are not recorded'
    - kind: exclusion
      criterion: 'another indication for ECMO, age > 78, mechanical cause'
      applied: 'partly'
      note: 'age could be applied; the trial''s cut is not'
  ecls_shock:
    - kind: inclusion
      criterion: 'acute MI with planned revascularisation'
      applied: 'partly'
      note: 'MI yes; the revascularisation plan is not recorded'
    - kind: inclusion
      criterion: 'SBP < 90 for > 30 min or catecholamines to maintain > 90'
      applied: 'yes'
      note: 'criterion 1 of this cohort'
    - kind: inclusion
      criterion: 'signs of impaired organ perfusion'
      applied: 'yes'
      note: 'criterion 2 of this cohort'
    - kind: inclusion
      criterion: 'arterial lactate > 3 mmol/L'
      applied: 'yes'
      note: 'lactate nearest onset'
    - kind: exclusion
      criterion: 'age > 80'
      applied: 'yes'
      note: 'applied'
    - kind: exclusion
      criterion: 'CPR > 45 min before enrolment'
      applied: 'no'
      note: 'arrest is coded, its duration is not'
    - kind: exclusion
      criterion: 'severe peripheral vascular disease'
      applied: 'yes'
      note: 'applied'
    - kind: exclusion
      criterion: 'mechanical or non-cardiac cause, shock > 12 h'
      applied: 'partly'
      note: 'shock duration could be applied; cause cannot'
  danger_shock:
    - kind: inclusion
      criterion: 'STEMI or STEMI equivalent'
      applied: 'yes'
      note: 'ICD-coded ST-elevation infarction'
    - kind: inclusion
      criterion: 'SBP < 100 mmHg or ongoing vasopressor support'
      applied: 'yes'
      note: 'criterion 1 of this cohort'
    - kind: inclusion
      criterion: 'arterial lactate > 2.5 mmol/L'
      applied: 'yes'
      note: 'lactate nearest onset'
    - kind: inclusion
      criterion: 'left ventricular ejection fraction < 45%'
      applied: 'no'
      note: 'no echo table at either site -- the eligible set is a superset on this'
    - kind: exclusion
      criterion: 'comatose after out-of-hospital arrest (GCS < 8)'
      applied: 'yes'
      note: 'arrest code plus lowest GCS in the window'
    - kind: exclusion
      criterion: 'severe aortic stenosis or regurgitation'
      applied: 'yes'
      note: 'applied'
    - kind: exclusion
      criterion: 'severe peripheral arterial disease'
      applied: 'yes'
      note: 'applied'
    - kind: exclusion
      criterion: 'shock duration > 24 h, severe right ventricular failure'
      applied: 'partly'
      note: 'duration could be applied; RV failure needs an echo'

  # ------------------------------------------------- the five added trials
  #
  # Unlike the baseline tables above, these criteria are NOT placeholders. A
  # trial's enrolment criteria are part of how it is identified rather than a
  # number read off a table, and each row below says plainly what this
  # pipeline can and cannot apply. Where a criterion turns on fluid volume the
  # answer is always 'no', and always for the same reason: neither site's
  # CLIF-2.1 extract has an intake/output table.

  smart:
    - kind: inclusion
      criterion: 'adult ICU patients receiving crystalloid'
      applied: 'partly'
      note: 'narrowed to coded septic shock on a vasopressor, so this is a sicker slice than the trial enrolled -- SMART was an all-comers ICU trial'
    - kind: inclusion
      criterion: 'balanced crystalloid rather than saline'
      applied: 'no'
      note: 'no balanced crystalloid exists as a med_category at either site, and no intake/output table carries volumes, so neither the arm nor concordance is ascertainable'
  aprocchss:
    - kind: inclusion
      criterion: 'septic shock with vasopressor-dependent hypotension for at least 6 h'
      applied: 'partly'
      note: 'coded septic shock plus a vasopressor; the 6 h duration is not applied, as for ADRENAL'
    - kind: inclusion
      criterion: 'SOFA score indicating at least two organ failures'
      applied: 'no'
      note: 'SOFA is joined for the severity adjustment but is not used to gate eligibility, so this is a superset'
    - kind: exclusion
      criterion: 'septic shock for more than 24 h, already on a corticosteroid'
      applied: 'no'
      note: 'shock duration is available but the indication for a prior steroid is not recorded'
    - kind: inclusion
      criterion: 'hydrocortisone plus fludrocortisone'
      applied: 'yes'
      note: 'both are med_categories at both sites, so this regimen is distinguishable from ADRENAL hydrocortisone alone -- the only trial pair here where concordance separates them'
  sixtyfive:
    - kind: inclusion
      criterion: 'aged 65 or over with vasodilatory shock on vasopressors'
      applied: 'partly'
      note: 'age and vasopressor applied directly; vasodilatory shock is read as the coded septic type, so non-septic vasodilatory shock is missed'
    - kind: exclusion
      criterion: 'vasopressors for more than 6 h before enrolment'
      applied: 'no'
      note: 'vasoactive_onset_dttm gives a start time, but the trial times from the clinician decision rather than from the first dose'
    - kind: inclusion
      criterion: 'permissive hypotension, MAP target 60-65 mmHg'
      applied: 'partly'
      note: 'achieved MAP is in the vitals and could be compared against the target, but a target is a clinician intention and an achieved pressure is not the same thing'
  classic:
    - kind: inclusion
      criterion: 'septic shock having already received at least 1 L of intravenous fluid'
      applied: 'partly'
      note: 'coded septic shock plus a vasopressor; the volume prerequisite is not computable, so the eligible set is a superset'
    - kind: inclusion
      criterion: 'restrictive versus standard intravenous fluid'
      applied: 'no'
      note: 'the arms are defined entirely by fluid volume, which no table at either site carries'
  clovers:
    - kind: inclusion
      criterion: 'sepsis-induced hypotension refractory to 1-3 L of initial fluid'
      applied: 'partly'
      note: 'coded septic shock plus a vasopressor or sustained hypotension; the fluid-refractory prerequisite is not computable'
    - kind: exclusion
      criterion: 'more than 4 h since meeting the hypotension criterion, more than 24 h since presentation'
      applied: 'no'
      note: 'not timed against the trial clock'
    - kind: inclusion
      criterion: 'restrictive fluid with early vasopressor versus liberal fluid'
      applied: 'no'
      note: 'half the contrast is visible -- vasoactive_onset_dttm times the vasopressor start -- and half is not, so no concordance flag is defined rather than one built on the measurable half alone'
