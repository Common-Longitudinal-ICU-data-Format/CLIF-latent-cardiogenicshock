%YAML 1.2
---
# Copy to paths.yaml and fill in for this machine. paths.yaml is machine-
# specific and is NOT in git -- it names local data locations, which differ at
# every site and should not be published.
#
#   cp code/config/paths.example.yaml code/config/paths.yaml

# Every site this machine holds CLIF-2.1 data for. The key is the label that
# appears in plots and in the `site` column; add or remove entries freely.
# Scatterplots cap at three sites (the colour palette's all-pairs gate).
sites:
  UCMC:
    data_dir: /path/to/CLIF_UCMC_2_1
  NU:
    data_dir: /path/to/CLIF_NU_2_1
  # RUSH:
  #   data_dir: /path/to/CLIF_RUSH_2_1

# Frozen foundation models. Each key is the label used in output paths, so the
# same cohort can be embedded by several models without their results
# colliding. All the GEM checkpoints share one architecture and one 1344-token
# vocabulary, so they all read the same tokenized data.
#
# NOTE the single-character wildcard. The weights directory holds both
# `GEM-mimic-icu` and `GEM<star>-mimic-icu`; `GEM?-` matches only the second
# (the 5-epoch "star" run), while `GEM*-` would match both and be ambiguous.
models:
  GEM-all:
    home_glob: /path/to/GEM-weights-FL-manuscript/GEM?-all/mdl-cotorra
  GEM-mimic-icu:
    home_glob: /path/to/GEM-weights-FL-manuscript/GEM?-mimic-icu/mdl-cotorra
  GEM-ucmc-icu:
    home_glob: /path/to/GEM-weights-FL-manuscript/GEM?-ucmc-icu/mdl-cotorra

default_model: GEM-all

# The fitted cocoa tokenizer the models were TRAINED with, shared by all of
# them.
#
# This is not interchangeable. A model's embedding table has one row per token
# id and the numeric bin edges are baked into the token names, so a tokenizer
# learned anywhere else maps the same clinical event to a different id and the
# representations become meaningless. 02 refuses to run if the vocabulary size
# does not match the model's.
tokenizer_yaml: /path/to/GEM-weights-FL-manuscript/tokenizer.yaml

output_home: ./output

# Intermediates: cohort-restricted CLIF tables, token streams, raw feature
# shards. Large (hundreds of GB for a big cohort) and fully regenerable, so put
# this on fast scratch -- never on a synced drive (Box, Dropbox, OneDrive),
# which will both sync it and lock the files.
scratch_home: /path/to/fast/scratch/clif-cs
