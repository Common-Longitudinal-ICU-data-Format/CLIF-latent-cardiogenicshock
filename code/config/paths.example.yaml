%YAML 1.2
---
# Copy to paths.yaml and fill in for this machine. paths.yaml is machine-
# specific and is NOT in git -- it names local data locations, which differ at
# every site and should not be published.
#
#   cp code/config/paths.example.yaml code/config/paths.yaml
#
# ONE KEY IS REQUIRED: `sites.<NAME>.data_dir`. Everything else below either
# defaults or degrades, so the shortest working paths.yaml is four lines:
#
#   role: site
#   sites:
#     YOURSITE:
#       data_dir: /path/that/actually/exists/CLIF_YOURSITE_2_1
#
# What you give up by leaving the rest alone:
#
#   tokenizer_yaml           01 skips the `tokenize`, `winnow` and
#                            `tokencounts` stages, so the bundle carries no
#                            token-prevalence tables and this site does not
#                            appear in the token-space decomposition of the
#                            site effect. The cohort, the three phenotype
#                            breakdowns, the baseline tables and the entire
#                            trial and guideline analysis are unaffected.
#   models.<key>.home_glob   tier 2 (02_site_embeddings.py) and
#                            08_token_space.py refuse to start. Tier 1 never
#                            loads the weights.
#   scratch_home             defaults to ./scratch
#   output_home              defaults to ./output

# Which side of the federation this machine is.
#
#   site    holds raw CLIF data and may read it. Runs 01 and 02.
#   pooled  holds only the bundles contributing sites sent, and may NOT read
#           raw data -- `paths.site_data` raises. Runs 03 onward.
#
# A coordinating institution that ALSO holds its own data is a `site` for the
# purpose of producing its own bundle, then re-runs the pooled scripts with
# `--role pooled`. Every script takes `--role` to override this per run, which
# is how one machine does both.
#
# Under `role: pooled` an empty `sites:` block below is legitimate: a pure
# coordinating machine holds no CLIF data at all. It still needs the model and
# tokenizer, because it has to verify that the bundles it received were
# produced under the weights it is about to interpret them against.
role: site


# Every site this machine holds CLIF-2.1 data for. The key is the label that
# appears in plots and in the `site` column; add or remove entries freely.
# Scatterplots cap at three sites (the colour palette's all-pairs gate).
sites:
  UCMC:
    data_dir: /path/to/CLIF_UCMC_2_1
  NU:
    data_dir: /path/to/CLIF_NU_2_1
  # RUSH:
  #   data_dir: /path/to/CLIF_RUSH_2_1

# Frozen foundation models. Each key is the label used in output paths, so the
# same cohort can be embedded by several models without their results
# colliding. All the GEM checkpoints share one architecture and one 1344-token
# vocabulary, so they all read the same tokenized data.
#
# OPTIONAL FOR TIER 1. `01_site_tables.py` never loads the weights -- it reads
# the tokenizer below, which is a different file. The glob is resolved on
# access, so if you are only being asked for the aggregate tables you can leave
# these paths pointing at nothing and tier 1 runs. Tier 2
# (`02_site_embeddings.py`) and `08_token_space.py` resolve it and will refuse
# to start until it points at exactly one directory holding `config.json`.
#
# NOTE the single-character wildcard. The weights directory holds both
# `GEM-mimic-icu` and `GEM<star>-mimic-icu`; `GEM?-` matches only the second
# (the 5-epoch "star" run), while `GEM*-` would match both and be ambiguous.
models:
  GEM-all:
    home_glob: /path/to/GEM-weights-FL-manuscript/GEM?-all/mdl-cotorra
  GEM-mimic-icu:
    home_glob: /path/to/GEM-weights-FL-manuscript/GEM?-mimic-icu/mdl-cotorra
  GEM-ucmc-icu:
    home_glob: /path/to/GEM-weights-FL-manuscript/GEM?-ucmc-icu/mdl-cotorra

default_model: GEM-all

# The fitted cocoa tokenizer the models were TRAINED with, shared by all of
# them. OPTIONAL: needed by the three token stages and by tier 2, and by
# nothing else in 01. Leave it out and those stages are skipped with a warning
# and the rest of the bundle exports normally.
#
# When it IS set it has to be the training-time one. The token-prevalence
# tables are token ids, comparable across sites only under one mapping, and the
# manifest records this file's hash so the coordinating site can check that.
# A bundle with no tokenizer hash ships no token tables -- deliberately, since
# counts in an unidentified mapping are worse than no counts.
#
# This is not interchangeable. A model's embedding table has one row per token
# id and the numeric bin edges are baked into the token names, so a tokenizer
# learned anywhere else maps the same clinical event to a different id and the
# representations become meaningless. 02 refuses to run if the vocabulary size
# does not match the model's.
tokenizer_yaml: /path/to/GEM-weights-FL-manuscript/tokenizer.yaml

# OPTIONAL, defaults to ./output
output_home: ./output

# Intermediates: cohort-restricted CLIF tables, token streams, raw feature
# shards. Large (hundreds of GB for a big cohort) and fully regenerable.
#
# OPTIONAL, defaults to ./scratch -- which gets a run working with no setup and
# is the wrong answer for a real cohort. Point it at fast scratch, and NEVER at
# a synced drive (Box, Dropbox, OneDrive): those will both replicate hundreds of
# GB of regenerable data and hold locks on the files, after which the directory
# cannot even be deleted. The resolved location is printed on every run.
scratch_home: /path/to/fast/scratch/clif-cs
